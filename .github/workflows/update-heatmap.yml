name: Update Contribution Heatmap

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and theme latest contribution heatmap
        run: |
          mkdir -p assets
          curl -s "https://ghchart.rshah.org/58a6ff/Abu1820" > assets/heatmap.svg
          # Convert light-mode background to dark-mode palette matching GitHub Dark
          sed -i 's/#EEEEEE/#161b22/g' assets/heatmap.svg
          sed -i 's/#767676/#8b949e/g' assets/heatmap.svg

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/heatmap.svg
          if git diff --staged --quiet; then
            echo "Heatmap is already up to date."
          else
            git commit -m "chore(auto): update contribution heatmap [skip ci]"
            git push
          fi
