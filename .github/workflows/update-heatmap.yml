name: Update Contribution Heatmap

on:
  schedule:
    # Runs automatically every 6 hours to capture daily commits promptly
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/heatmap.svg'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and theme latest contribution heatmap
        run: |
          mkdir -p assets
          # Fetch using official GitHub contribution green base
          curl -s "https://ghchart.rshah.org/39d353/Abu1820" > temp_heatmap.svg || true
          if grep -q 'data-score' temp_heatmap.svg 2>/dev/null; then
            mv temp_heatmap.svg assets/heatmap.svg
          fi
          # Convert light-mode background and labels to GitHub Dark Mode
          sed -i 's/#EEEEEE/#161b22/g' assets/heatmap.svg
          sed -i 's/#eeeeee/#161b22/g' assets/heatmap.svg
          sed -i 's/#767676/#8b949e/g' assets/heatmap.svg
          # Convert active squares to GitHub's exact 4-level dark-mode green palette
          sed -i 's/#a5f3ff/#0e4429/g' assets/heatmap.svg
          sed -i 's/#8bd9ff/#006d32/g' assets/heatmap.svg
          sed -i 's/#58a6ff/#26a641/g' assets/heatmap.svg
          sed -i 's/#4685cc/#39d353/g' assets/heatmap.svg

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/heatmap.svg
          if git diff --staged --quiet; then
            echo "Heatmap is already up to date."
          else
            git commit -m "chore(auto): update contribution heatmap [skip ci]"
            git push
          fi
